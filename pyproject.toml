[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-fast-modeladmin"
version = "1.0.0"
description = "Faster Admin model control via a settings dictionary"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "SimplePythonCoder"}
]
license = "MIT"
requires-python = ">=3.14"
dependencies = ['django']
classifiers = [
        'Development Status :: 5 - Production/Stable',
        'Intended Audience :: Developers',
        'Programming Language :: Python :: 3.11',
        'Operating System :: Microsoft :: Windows :: Windows 10',
        'Topic :: Utilities',
]
keywords = ['django', 'django-admin']

[project.urls]
Homepage = 'https://github.com/SimplePythonCoder/django-fast-modeladmin'
Source = 'https://github.com/SimplePythonCoder/django-fast-modeladmin'
Changelog = 'https://github.com/SimplePythonCoder/django-fast-modeladmin/blob/main/CHANGELOG.md'
Documentation = 'https://github.com/SimplePythonCoder/django-fast-modeladmin/wiki'
Issues = 'https://github.com/SimplePythonCoder/django-fast-modeladmin/issues'

[tool.setuptools.packages.find]
include = ["fast_modeladmin*"]